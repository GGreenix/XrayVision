pi:
  ip: 10.0.0.103
  port: 8765

calibration_file: pi/config/stereo_calibration.yaml

sgbm:
  min_disparity: 2
  num_disparities: 96
  block_size: 3
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 32
  min_depth_m: 0.3
  max_depth_m: 3.5
  downscale: 4
  mode: "HH"

pose:
  position_m: [0.0, 0.0, 1.5]
  rpy_deg: [0.0, 0.0, 0.0]
  mount_rpy_deg: [0.0, 0.0, 0.0]

mesh:
  enabled: false
  path: "unity/XrayVisionVR/Assets/Models/Scaniverse_2026_05_05_181025.obj"
  icp_threshold: 0.1
  localization_interval_s: 10

detector:
  model_path: yolov8n.pt
  confidence_threshold: 0.35
  imgsz: 416
  device: "0"
  allowed_classes: []
  depth_window: 4

server:
  host: 0.0.0.0
  port: 8766
  detection_rate_hz: 30.0
