camera_publisher:
  ros__parameters:
    topic: /xray/camera/image/compressed
    frame_id: camera_link
    width: 1280
    height: 720
    rate_hz: 30.0
    jpeg_quality: 80

static_pose_publisher:
  ros__parameters:
    frame_id: map
    child_frame_id: base_link
    rate_hz: 2.0
    # Pi camera's position in the world frame (meters).
    # Adjust for where you physically mount the Pi.
    position_m: [0.0, 0.0, 1.5]
    # Orientation in degrees (roll, pitch, yaw) about the map frame axes.
    # Default: level, facing +X.
    rpy_deg: [0.0, 0.0, 0.0]

yolo_detector:
  ros__parameters:
    model_path: yolov8n.pt
    confidence_threshold: 0.35
    iou_threshold: 0.5
    imgsz: 640
    device: ""           # "" = auto, "cpu", "cuda:0"
    source_frame: camera_link
    # Empty [""] means "publish all classes". Example filter: ["person", "car"].
    allowed_classes: [""]

static_camera_localizer:
  ros__parameters:
    world_frame: map
    ground_z_m: 0.0
    # Must match the static_pose_publisher values above.
    position_m: [0.0, 0.0, 1.5]
    rpy_deg: [0.0, 0.0, 0.0]
    # Additional tilt/roll of the camera rig relative to the body.
    # If you tilt the Pi down by 10 degrees, set pitch here, not in rpy_deg.
    camera_mount_rpy_deg: [0.0, 0.0, 0.0]
    # Intrinsics: leave fx=fy=0 to use horizontal_fov_deg fallback.
    # Calibrate with cv2.calibrateCamera and fill these in for real use.
    image_width: 1280
    image_height: 720
    fx: 0.0
    fy: 0.0
    cx: 0.0
    cy: 0.0
    horizontal_fov_deg: 66.0  # Pi Camera Module v2 ~62deg; v3 wide ~102deg
