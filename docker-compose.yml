name: xrayvision

x-common-env: &common-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
  CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///opt/xray/config/cyclonedds.xml}
  XRAY_MODE: ${XRAY_MODE:-sim}
  XRAY_SIM_BACKEND: ${XRAY_SIM_BACKEND:-mock}
  XRAY_USE_FAKE_POSE: ${XRAY_USE_FAKE_POSE:-true}
  XRAY_USE_FAKE_DETECTIONS: ${XRAY_USE_FAKE_DETECTIONS:-true}
  XRAY_USE_SIM_TIME: ${XRAY_USE_SIM_TIME:-false}
  ROS_TCP_ENDPOINT_PORT: ${ROS_TCP_ENDPOINT_PORT:-10000}
  VIDEO_STREAM_PATH: ${VIDEO_STREAM_PATH:-drone_cam}

x-common-service: &common-service
  build:
    context: .
    dockerfile: docker/ros.Dockerfile
  network_mode: host
  environment: *common-env
  volumes:
    - ./config:/opt/xray/config:ro
    - ./bags:/opt/xray/bags
    - ./logs:/opt/xray/logs
  restart: unless-stopped

services:
  sim_backend:
    <<: *common-service
    profiles: ["sim"]
    command: >
      ros2 launch xray_bringup sim_backend.launch.py
      backend:=${XRAY_SIM_BACKEND:-mock}
      use_fake_pose:=${XRAY_USE_FAKE_POSE:-true}
      use_fake_detection:=${XRAY_USE_FAKE_DETECTIONS:-true}
      use_sim_time:=${XRAY_USE_SIM_TIME:-false}
      headless:=${XRAY_GAZEBO_HEADLESS:-true}

  drone:
    <<: *common-service
    profiles: ["real"]
    command: >
      ros2 launch xray_bringup drone.launch.py
      use_fake_pose:=${XRAY_USE_FAKE_POSE:-false}
      use_fake_detection:=${XRAY_USE_FAKE_DETECTIONS:-false}

  ground:
    <<: *common-service
    profiles: ["sim", "real"]
    command: >
      ros2 launch xray_bringup ground.launch.py
      mode:=${XRAY_MODE:-sim}
      use_sim_time:=${XRAY_USE_SIM_TIME:-false}

  unity_bridge:
    <<: *common-service
    profiles: ["sim", "real"]
    command: >
      ros2 launch xray_bringup unity_bridge.launch.py
      ros_tcp_port:=${ROS_TCP_ENDPOINT_PORT:-10000}

  video_gateway:
    image: bluenviron/mediamtx:1.8.4
    profiles: ["sim", "real"]
    network_mode: host
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  debug_shell:
    <<: *common-service
    profiles: ["debug"]
    command: bash
    stdin_open: true
    tty: true
    restart: "no"
