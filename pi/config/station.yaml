# Pi station configuration. Read by xray_pi.station at startup.
# All paths are absolute — installer copies the calibration into /opt/xray.

# stereo: dual cameras + SGBM depth (default).
# mono:   single camera, no depth — detector falls back to ground-plane
#         projection. Requires detector.sample_bbox_bottom: true.
mode: stereo

calibration_file: /opt/xray/config/stereo_calibration.yaml

mono:
  # Only used if mode: mono. Falls back to capture.left_device if unset.
  device: ""
  horizontal_fov_deg: 89.0

capture:
  # OV9281 native: 1280x800 mono global-shutter. Using 1280x720 to match calibration.
  width: 1280
  height: 720
  fps: 30.0
  # Stable USB device paths. Many Arducam OV9281 modules ship with
  # identical USB serials, so /dev/v4l/by-id/ collides — use by-path
  # (identifies cameras by USB port). Find yours with:
  #   ls -l /dev/v4l/by-path/
  # Mark the physical USB ports LEFT/RIGHT so plugging never swaps them.
  left_device:  /dev/v4l/by-path/platform-xhci-hcd.0-usb-0:1:1.0-video-index0
  right_device: /dev/v4l/by-path/platform-xhci-hcd.1-usb-0:1:1.0-video-index0

sgbm:
  # 1=full res (very slow on Pi 5), 2=half (recommended), 3=third (fastest).
  downscale: 2
  min_disparity: 0
  num_disparities: 96       # multiple of 16
  block_size: 7
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  min_depth_m: 0.3
  max_depth_m: 8.0

pose:
  # Where the LEFT camera's optical center sits in the world frame.
  position_m: [0.0, 0.0, 1.5]
  # Roll/pitch/yaw of the camera body around the world axes (degrees).
  rpy_deg: [0.0, 0.0, 0.0]
  # Extra tilt of the camera rig relative to the body (e.g. pitch -10
  # if you angle the rig downward).
  mount_rpy_deg: [0.0, 0.0, 0.0]

detector:
  model_path: yolov8n.pt
  confidence_threshold: 0.35
  iou_threshold: 0.5
  imgsz: 640
  device: ""               # "" = auto, "cpu", "cuda:0"
  allowed_classes: []      # empty = all classes
  sample_bbox_bottom: false  # true = sample bbox foot (useful w/ ground-plane fallback)
  depth_window: 4
  # Ground-plane fallback: when stereo depth is missing for a detection,
  # ray-cast onto z = ground_z_m. Useful if SGBM can't see a person against
  # a textureless wall but you still want a rough position. Off by default.
  ground_plane_fallback: false
  ground_z_m: 0.0
  max_range_m: 50.0

server:
  host: 0.0.0.0
  port: 8765
  detection_rate_hz: 10.0   # YOLO + localization cycle target
  video_rate_hz: 15.0       # MJPEG stream rate
  video_jpeg_quality: 75
